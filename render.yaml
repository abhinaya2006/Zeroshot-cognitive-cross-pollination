services:
  # Backend FastAPI service
  - type: web
    name: cognitive-cross-pollination-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        value: sqlite:///./cognitive_cross_pollination.db
      - key: EMBEDDINGS_MODEL
        value: all-MiniLM-L6-v2
      - key: GROQ_API_KEY
        sync: false
